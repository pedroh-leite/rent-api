openapi: 3.0.3
info:
  title: Rent API
  description: API para gerenciamento de imóveis e usuários [projeto utilizado para estudos]
  version: 1.0.0

servers:
  - url: http://localhost:3000

tags:
  - name: Auth
  - name: Users
  - name: Properties

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        name:
          type: string
        lastname:
          type: string
        birthDate:
          type: string
          format: date
        email:
          type: string
        cellphone:
          type: string

    Property:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        email:
          type: string
        address:
          type: string
        number:
          type: string
        complement:
          type: string
        neighborhood:
          type: string
        city:
          type: string
        country:
          type: string
        cep:
          type: string
        number_of_rooms:
          type: string

paths:

  /:
    get:
      tags: [Auth]
      summary: Root route
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API is running

  /token:
    post:
      tags: [Auth]
      summary: Generate JWT token
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              example:
                data:
                  token: "jwt-token"

  /users/{guid}:
    get:
      tags: [Users]
      summary: Get user by GUID
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated

    delete:
      tags: [Users]
      summary: Delete user
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted

  /users:
    post:
      tags: [Users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Name
              lastname: Surname
              birthDate: YYYY-MM-DD
              email: email@email.com
              cellphone: "11999999999"
      responses:
        '201':
          description: User created

  /properties/{guid}:
    get:
      tags: [Properties]
      summary: Get property by GUID
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'

    patch:
      tags: [Properties]
      summary: Update property
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              address: Rua update
              neighborhood: updated neighborhood
      responses:
        '200':
          description: Property updated

    delete:
      tags: [Properties]
      summary: Delete property
      security:
        - bearerAuth: []
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property deleted

  /properties:
    post:
      tags: [Properties]
      summary: Create property
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: teste@email.com
              address: Rua da propriedade
              number: "20"
              complement: N/A
              neighborhood: Bairro da propriedade
              city: Cidade da propriedade
              country: País da propriedade
              cep: "00000000"
              number_of_rooms: "8"
      responses:
        '201':
          description: Property created